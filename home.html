<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .navbar {
    font-size: x-small;
    display: flex;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background-color: white;
    z-index: 1000;
    height: 90px;
    width: 100%;
  }

  .navbar button {
    margin: 13px;
    vertical-align: top;
    display: flex;
    border: none;
    background-color: white;
    color: #3d5570;
    transition: background-color 0.15s, padding 0.15s;
    padding: 7px;
    cursor: pointer;
  }

  .navbar button:hover {
    background-color: #2585a0;
    color: white;
    padding: 10px;
    margin: 10px;
  }

  a {
    text-decoration: none;
  }

  body {
    padding-top: 90px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .section {
    height: 650px;
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .heading {
    position: relative;
    width: 100%;
  }

  .heading img {
    width: 100%;
    height: 650px;
    object-fit: cover;
    object-position: top;
  }

  .heading::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(42, 62, 84, 0.8);
    z-index: 10;
  }
</style>


<body>
    <div class="navbar">
        <img
          style="
            width: 350px;
            height: 150px;
            margin-left: -5px;
            margin: bottom 2px;
            margin-top: 19px;
          "
          src="images/logo1.png"
          alt="Dermaliss logo"
        />
        <a style="margin-left: 40%" href=":any-link"><button type="">HOME</button></a>
        <a href="Products.html"><button type="button">PRODUCTS</button></a>
        <a href="remedies.html"><button type="button">REMEDIES</button></a>
        <a href="massages.html"><button type="button">MASSAGES</button></a>
        <a href=":any-link"><button type="button">ABOUT US</button></a>
      </div>
  
      <div class="heading section">
        <img src="images/homeremediesbg.jpg" alt="background for home remedies" />
        <h1 class="text-overlay">Home Remedies for Skincare</h1>
        <h3 class="slogan">
          From Your Kitchen to Your Skin: Simple Remedies for All
        </h3>
      </div>
  
    
</body>
</html>
